<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Management</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
    
  <div class="container">
    <h1>User Management System</h1>
    <p>Add users manually or fetch random ones.</p>

    <div class="flex">
      <input type="text" class="input" placeholder="Enter Name" id="name" />
      <input type="email" class="input" placeholder="Enter Email" id="email" />
    </div>

    <button class="btn" onclick="addOrUpdateUser()">
      <span id="submitBtnText">Add User</span>
    </button>
    <button class="btn" onclick="fetchRandomUser()">Fetch Random User</button>

    <h2>Enrolled Users</h2>
    <ul id="userList"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
